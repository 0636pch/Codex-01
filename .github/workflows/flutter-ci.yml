name: Flutter CI

on:
  push:
    branches: [develop]
    paths:
      - 'body_quest/**'
      - '.github/workflows/flutter-ci.yml'
  pull_request:
    paths:
      - 'body_quest/**'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: body_quest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate platform scaffold
        run: flutter create . --platforms=android,ios,web
      - name: Configure Firebase Android
        run: bash tool/configure_android.sh
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Build Android debug APK
        run: flutter build apk --debug
